// ===================== 铜钱起卦核心逻辑 =====================
// 铜钱：3枚，正=3，反=2；总和：6老阴、7少阳、8少阴、9老阳
function shakeOneYao(){
    let sum = 0;
    for(let i=0;i<3;i++){
        sum += Math.random()>0.5 ? 3 : 2;
    }
    if(sum === 6) return {type:"老阴", symbol:"⚋", change:true};
    if(sum === 7) return {type:"少阳", symbol:"⚊", change:false};
    if(sum === 8) return {type:"少阴", symbol:"⚋", change:false};
    if(sum === 9) return {type:"老阳", symbol:"⚊", change:true};
}

// 摇六爻，从下往上
function shakeSixYao(){
    let yaoList = [];
    for(let i=0;i<6;i++){
        yaoList.push(shakeOneYao());
    }
    return yaoList;
}

// 根据六爻得到卦名（简易映射，配套上面guaData的key）
function getGuaName(yaoList){
    // 下卦（前3爻）、上卦（后3爻）
    const lower = yaoList.slice(0,3);
    const upper = yaoList.slice(3,6);
    const baGuaMap = {
        "111":"乾","000":"坤","010":"坎","101":"离","100":"震","001":"艮","011":"兑","110":"巽"
    };
    function getBagua(three){
        let s = three.map(y=>y.symbol==="⚊"?"1":"0").join("");
        return baGuaMap[s];
    }
    const upName = getBagua(upper);
    const lowName = getBagua(lower);
    const fullName = `${upName}${lowName}`;
    const allGuaMap = {
        "乾乾":"乾为天","坤坤":"坤为地","坎震":"水雷屯","艮坎":"山水蒙","坎乾":"水天需","乾坎":"天水讼",
        "坤坎":"地水师","坎坤":"水地比","乾巽":"风天小畜","兑乾":"天泽履","坤乾":"地天泰","乾坤":"天地否",
        "乾离":"天火同人","离乾":"火天大有","坤艮":"地山谦","震坤":"雷地豫","兑震":"泽雷随","艮巽":"山风蛊",
        "坤兑":"地泽临","巽坤":"风地观","离震":"火雷噬嗑","艮离":"山火贲","艮坤":"山地剥","坤震":"地雷复",
        "乾震":"天雷无妄","艮乾":"山天大畜","艮震":"山雷颐","兑巽":"泽风大过","坎坎":"坎为水","离离":"离为火",
        "兑艮":"泽山咸","震巽":"雷风恒","乾艮":"天山遁","震乾":"雷天大壮","离坤":"火地晋","坤离":"地火明夷",
        "巽离":"风火家人","离兑":"火泽睽","坎艮":"水山蹇","震坎":"雷水解","兑坤":"泽地萃","坤巽":"地风升",
        "兑坎":"泽水困","坎巽":"水风井","兑离":"泽火革","离巽":"火风鼎","震震":"震为雷","艮艮":"艮为山",
        "巽艮":"风山渐","震兑":"雷泽归妹","震离":"雷火丰","离艮":"火山旅","巽巽":"巽为风","兑兑":"兑为泽",
        "巽坎":"风水涣","坎兑":"水泽节","巽兑":"风泽中孚","震艮":"雷山小过","坎离":"水火既济","离坎":"火水未济"
    };
    return allGuaMap[fullName];
}

// ===================== 页面渲染 =====================
const btn = document.getElementById("shakeBtn");
const contentWrap = document.getElementById("content");

btn.onclick = async function(){
    btn.disabled = true;
    btn.classList.add("shake-animate");
    contentWrap.innerHTML = "<div class='empty-tip'>正在摇卦……</div>";

    // 模拟等待，增强体验
    await new Promise(resolve=>setTimeout(resolve, 800));

    const yaoList = shakeSixYao();
    const guaNameKey = getGuaName(yaoList);
    const guaInfo = guaData[guaNameKey];

    // 渲染爻，变爻标红
    let yaoHtml = yaoList.map(y=>{
        return y.change ? `<span class="yao-change">${y.symbol}</span>` : y.symbol;
    }).join("");

    let html = "";
    if(guaInfo){
        html = `
            <div class="yao-wrap">${yaoHtml}</div>
            <div class="item-title">卦名：</div>
            <div>${guaInfo.name}（${guaNameKey}）</div>
            <div class="item-title">卦辞原文：</div>
            <div>${guaInfo.original}</div>
            <div class="item-title">趣味参考：</div>
            <div>${guaInfo.desc}</div>
            <!-- 【拓展点】此处可替换为fetch请求后端AI接口，动态生成解读 -->
        `;
    }else{
        html = `<div class="empty-tip">未匹配到卦象数据</div>`;
    }
    contentWrap.innerHTML = html;

    btn.classList.remove("shake-animate");
    btn.disabled = false;
}
</script>
